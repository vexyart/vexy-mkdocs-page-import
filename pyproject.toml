# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-mkdocs-page-import"
dynamic = ["version"]
description = "Replace a rendered MkDocs or ProperDocs page with precompiled HTML."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vexy Lines Team", email = "help@vexy.art" }]
keywords = ["mkdocs", "properdocs", "plugin", "html", "webflow"]
classifiers = [
    "Framework :: MkDocs",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
]
dependencies = ["mkdocs>=1.6", "beautifulsoup4>=4.13"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "markdownify>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-mkdocs-page-import"
Repository = "https://github.com/vexyart/vexy-mkdocs-page-import"

[project.entry-points."mkdocs.plugins"]
page-import = "vexy_mkdocs_page_import.plugin:PageImportPlugin"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_mkdocs_page_import/__version__.py"
template = """
# this_file: src/vexy_mkdocs_page_import/__version__.py
# Generated by hatch-vcs.
__version__ = "{version}"
"""

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_mkdocs_page_import"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "AGENTS.md", "DEPENDENCIES.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "PIE", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
