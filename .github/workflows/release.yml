# this_file: .github/workflows/release.yml
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.9"
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python -c 'import properdocs.replacement; import pytest; raise SystemExit(pytest.main(["-q"]))'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.9"
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vexy-mkdocs-page-import
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
