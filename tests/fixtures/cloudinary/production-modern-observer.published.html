<!DOCTYPE html>

<html><head><title>É</title><style>.w-webflow-badge{display:none !important;}</style></head><body><img class="hero cld-responsive" data-caption="Café" data-src="https://res.cloudinary.com/fontlab/image/upload/c_limit,w_auto/f_auto,q_auto,dpr_auto/vw/photo.jpg?size=2" loading="lazy" src="https://res.cloudinary.com/fontlab/image/upload/e_blur:2000,f_auto,q_auto:low/vw/photo.jpg?size=2"/><img data-cld-responsive="false" loading="lazy" src="https://res.cloudinary.com/fontlab/image/upload/f_auto,q_auto/vw/still.png"/><script data-cfasync="false" type="text/javascript">
(function() {
  function initResponsive() {
    const resizeObserver = new ResizeObserver(entries => {
      for (let entry of entries) {
        const img = entry.target;
        const width = img.clientWidth || (img.parentElement ? img.parentElement.clientWidth : 0);
        if (width > 0) {
          const dpr = window.devicePixelRatio || 1;
          const targetWidth = Math.ceil((width * dpr) / 100) * 100;
          const dataSrc = img.getAttribute('data-src');
          if (dataSrc) {
            const newSrc = dataSrc.replace('w_auto', 'w_' + targetWidth);
            if (img.getAttribute('src') !== newSrc) {
              img.style.transition = 'filter 0.4s ease-in-out';
              img.style.filter = 'blur(4px)';
              const handleLoad = () => {
                img.style.filter = 'none';
                img.removeEventListener('load', handleLoad);
              };
              img.addEventListener('load', handleLoad);
              img.setAttribute('src', newSrc);
              if (img.complete) {
                handleLoad();
              }
            }
          }
        }
      }
    });
    const intersectionObserver = new IntersectionObserver((entries, observer) => {
      for (let entry of entries) {
        if (entry.isIntersecting) {
          const img = entry.target;
          observer.unobserve(img);
          resizeObserver.observe(img);
        }
      }
    }, { rootMargin: '50px' });
    document.querySelectorAll('img.cld-responsive').forEach(img => {
      intersectionObserver.observe(img);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initResponsive);
  } else {
    initResponsive();
  }
})();
</script></body></html>
